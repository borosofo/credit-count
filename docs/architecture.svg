<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 212" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#1a1a1a">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Browser -->
  <rect x="10" y="40" width="150" height="122" rx="8" fill="#ffffff" stroke="#555"/>
  <text x="85" y="60" text-anchor="middle" font-weight="700" font-size="11">Browser</text>
  <text x="85" y="80" text-anchor="middle">Server-rendered pages</text>
  <text x="85" y="94" text-anchor="middle">Client Components (forms)</text>
  <text x="85" y="108" text-anchor="middle">Session cookie</text>
  <text x="85" y="122" text-anchor="middle">Publishable key only</text>
  <text x="85" y="146" text-anchor="middle" fill="#666" font-size="9">No secret ever ships here</text>

  <line x1="160" y1="100" x2="205" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="182" y="93" text-anchor="middle" font-size="8.5" fill="#444">HTTPS</text>

  <!-- Vercel -->
  <rect x="205" y="20" width="250" height="162" rx="8" fill="#ffffff" stroke="#555"/>
  <path d="M213 20 h234 a8 8 0 0 1 8 8 v12 h-250 v-12 a8 8 0 0 1 8 -8 z" fill="#2b2b2b"/>
  <text x="330" y="34" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="11">Vercel · Hobby · iad1</text>
  <text x="215" y="58" font-weight="700">Next.js 16 App Router</text>
  <text x="215" y="74">proxy.ts: refreshes the session, redirects visitors</text>
  <text x="215" y="88">Server Components: every read</text>
  <text x="215" y="102">Server Actions: every write, Zod-validated</text>
  <text x="215" y="116">/api/keepalive: daily Vercel Cron</text>
  <text x="215" y="136" fill="#666" font-size="9">@supabase/ssr sends the publishable key plus</text>
  <text x="215" y="148" fill="#666" font-size="9">the signed-in user's JWT on every request</text>
  <text x="215" y="168" fill="#666" font-size="9">Deploy: push to main (GitHub integration)</text>

  <line x1="455" y1="100" x2="500" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="477" y="93" text-anchor="middle" font-size="8.5" fill="#444">HTTPS</text>

  <!-- Supabase -->
  <rect x="500" y="20" width="250" height="162" rx="8" fill="#ffffff" stroke="#555"/>
  <path d="M508 20 h234 a8 8 0 0 1 8 8 v12 h-250 v-12 a8 8 0 0 1 8 -8 z" fill="#2b2b2b"/>
  <text x="625" y="34" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="11">Supabase · Free · us-east-1</text>
  <text x="510" y="58"><tspan font-weight="700">Auth</tspan>  email + password, issues the JWT</text>
  <text x="510" y="74"><tspan font-weight="700">Data API</tspan>  PostgREST, runs as the caller's role</text>
  <text x="510" y="94" font-weight="700">Postgres 17</text>
  <text x="510" y="108">profiles · coasters · rides</text>
  <text x="510" y="122">RLS policies + column-level grants</text>
  <text x="510" y="136">get_leaderboard() · is_admin() · merge_coaster()</text>
  <text x="510" y="156" fill="#666" font-size="9">The security boundary: the same rules hold for</text>
  <text x="510" y="168" fill="#666" font-size="9">the app, direct API calls and anything built later</text>

  <text x="380" y="204" text-anchor="middle" font-size="9" fill="#444">Every request carries the caller's identity and Postgres decides row by row. No service-role key exists anywhere in the system.</text>
</svg>
